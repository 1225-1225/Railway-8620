server {
    listen 80;
    server_name localhost;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：所有非文件路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端生成的铁路地图 HTML（来自共享 volume）
    location /maps/ {
        alias /usr/share/nginx/maps/;
        try_files $uri =404;
    }

    # API 代理到后端容器
    location /auth/ {
        proxy_pass http://backend:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /chat/ {
        proxy_pass http://backend:8000/chat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 流式传输需要关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 注意：不要再单独写 location /chat（不带斜杠）。
    # 前端路由本身就是 /chat，浏览器直接访问或刷新该路径时属于 SPA 导航，
    # 必须交给上面的 location / 回退到 index.html；若把它代理给后端，
    # 后端没有 GET /chat 路由，刷新页面就会 404。
    # API 调用都带 /chat/ 前缀（/chat/stream、/chat/sessions），由上面那个块处理。
}
