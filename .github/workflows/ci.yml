name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      # 只做基础检查：语法错误、未使用导入、未定义名
      - name: Ruff check
        run: ruff check . --select E9,F63,F7,F82 --exclude frontend,devtools,.venv
        continue-on-error: true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      # 测试环境变量（conftest 也会设置，这里显式声明保证尽早生效）
      JWT_SECRET_KEY: "ci-secret-key-for-tests-only"
      DATABASE_URL: "sqlite:///./test_users.db"
      # 避免 CI 上读取真实 .env
      LLM_API_KEY: "ci-dummy-key"
      EMBEDDING_API_KEY: "ci-dummy-key"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
